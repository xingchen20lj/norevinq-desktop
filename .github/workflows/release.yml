name: Desktop release artifacts

on:
  workflow_dispatch:
    inputs:
      require_signing:
        description: Fail unless platform signing credentials are configured
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source, licenses, and production dependencies
        run: pnpm audit:dependencies && pnpm audit:licenses && pnpm verify:ci

      - name: Require macOS signing credentials
        if: runner.os == 'macOS' && inputs.require_signing
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"

      - name: Require Windows signing credentials
        if: runner.os == 'Windows' && inputs.require_signing
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) { throw 'Windows signing credentials are missing.' }

      - name: Package macOS DMG and ZIP
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ inputs.require_signing && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.require_signing && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.require_signing && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.require_signing && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.require_signing && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.require_signing && 'true' || 'false' }}
        run: pnpm package:mac

      - name: Package Windows NSIS installer
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ inputs.require_signing && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.require_signing && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: pnpm package:win

      - name: Smoke-test packaged application
        run: pnpm check:package && pnpm exec playwright test tests/e2e/packaged.spec.ts

      - name: Validate macOS signing and notarization
        if: runner.os == 'macOS' && inputs.require_signing
        run: codesign --verify --deep --strict --verbose=2 "release/mac/Aster Code.app" && xcrun stapler validate "release/mac/Aster Code.app"

      - name: Validate Windows installer signature
        if: runner.os == 'Windows' && inputs.require_signing
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path release -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid signature for $($installer.Name): $($signature.Status)"
            }
          }

      - name: Write macOS checksums
        if: runner.os == 'macOS'
        run: shasum -a 256 release/*.dmg release/*.zip > release/SHA256SUMS.txt

      - name: Write Windows checksums
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-FileHash release/*.exe -Algorithm SHA256 | Format-Table -HideTableHeaders Path,Hash | Out-File release/SHA256SUMS.txt

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aster-code-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aster-code-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
