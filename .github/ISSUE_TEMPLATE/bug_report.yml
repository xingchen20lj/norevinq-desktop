name: Bug 报告
description: 报告可以稳定复现的 Norevinq 问题
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全问题请使用 Security Advisory，不要在这里公开凭据或漏洞细节。
  - type: input
    id: version
    attributes:
      label: Norevinq 版本或提交
      placeholder: 例如 0.1.0 或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS Intel
        - macOS Apple Silicon
        - Windows x64
        - Windows arm64
        - 其他/未确认
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、稳定且不包含私人数据的复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志或截图
      description: 删除 API Key、token、用户路径、私人代码和无关个人信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未找到相同问题。
          required: true
        - label: 本报告不包含凭据、私人仓库内容或未公开漏洞细节。
          required: true
